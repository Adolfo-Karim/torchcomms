name: Build and test torchcomms

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build_pip_wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "stable"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"

    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 60
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      upload-artifact: build-artifacts-${{ matrix.torch-version }}-${{ matrix.gpu-arch-type }}-${{ matrix.gpu-arch-version }}
      script: |
        set -ex
        source .github/scripts/setup_env.sh --with-cmake --cuda-version "${{ matrix.gpu-arch-version }}" "${{ matrix.torch-version }}"

        # Core torchcomms wheel: NCCL + Gloo + Transport. NCCLX has been
        # spun off into its own `torchcomms-ncclx` wheel (built in the
        # separate build_test_ncclx workflow).
        pip install build
        python -m build --wheel --no-isolation

        mkdir -p "${RUNNER_ARTIFACT_DIR}"
        cp dist/*.whl "${RUNNER_ARTIFACT_DIR}/"

        python -c "import torch; print(torch.__version__)" > "${RUNNER_ARTIFACT_DIR}/torch_version.txt"

  # C++ tests live in the build_test_ncclx workflow — comms/utils/checks.h
  # (used transitively by the test utilities) includes <folly/String.h>, and
  # folly is only installed by build_ncclx.sh.

  run_py_tests:
    needs: build_pip_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "stable"
          - runs-on: "linux.g5.12xlarge.nvidia.gpu"
            gpu-arch-type: "cuda"
            gpu-arch-version: "13.0"
            torch-version: "nightly"

    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      timeout: 120
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      download-artifact: build-artifacts-${{ matrix.torch-version }}-${{ matrix.gpu-arch-type }}-${{ matrix.gpu-arch-version }}
      script: |
        set -ex
        TORCH_VERSION=$(cat "${RUNNER_ARTIFACT_DIR}/torch_version.txt")
        source .github/scripts/setup_env.sh --cuda-version "${{ matrix.gpu-arch-version }}" --torch-version "$TORCH_VERSION" "${{ matrix.torch-version }}"

        export DISABLED_TESTS="${{ vars.DISABLED_TESTS }}"

        # Install from pre-built wheel (skip build step)
        WHEEL=$(ls "${RUNNER_ARTIFACT_DIR}"/*.whl)
        pip install "${WHEEL}[dev]"

        python -c "import torchcomms"

        # Run Python tests
        comms/torchcomms/scripts/run_tests_unit_py.sh
        comms/torchcomms/scripts/run_tests_integration_py.sh
